[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "boardscribe"
version = "0.1.0"
description = "First-person video to a rules-checked chess record, asking only when the evidence is not enough."
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.8",
  "python-chess>=1.10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
boardscribe = "boardscribe.cli:main"

[tool.setuptools.packages.find]
include = ["boardscribe*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
